name: Compilar Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar y Compilar EXE
        run: |
          pip install -r requirements.txt
          pyinstaller --noconfirm --onefile --windowed --name "PicoSIO-Flasher" main.py

            - name: Preparar Paquete y Descargar Firmwares
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_pkg/firmwares","release_pkg/tools/ite_scripts","release_pkg/tools/flashrom","release_pkg/tools/openocd" | Out-Null
          Copy-Item "dist/PicoSIO-Flasher.exe","chips_db.json","README.md" -Destination "release_pkg/" -ErrorAction SilentlyContinue
          "Coloca aqui flashrom.exe y sus DLLs" | Out-File "release_pkg/tools/flashrom/LEEME.txt"

          # 1. Debugprobe oficial para Raspberry Pi Pico
          curl.exe -L -s "https://github.com" -o "release_pkg/firmwares/debugprobe.uf2"

          # 2. pico_serprog.uf2
          curl.exe -L -s "https://github.com" -o "release_pkg/firmwares/pico_serprog.uf2"

          # 3. Scripts y firmware ITE (usando curl.exe)
          curl.exe -L -s "https://github.com" -o "ite.zip"
          if ((Get-Item "ite.zip").Length -gt 1000) {
            Expand-Archive "ite.zip" "temp_ite" -Force
            Get-ChildItem "temp_ite" -Recurse -Filter "*.py" | Copy-Item -Destination "release_pkg/tools/ite_scripts/"
            Get-ChildItem "temp_ite" -Recurse -Filter "*.uf2" | Select-Object -First 1 | Copy-Item -Destination "release_pkg/firmwares/ite_ec.uf2"
          }

          # 4. OpenOCD Windows (xPack v0.12.0-7 usando curl.exe)
          curl.exe -L -s "https://github.com" -o "ocd.zip"
          if ((Get-Item "ocd.zip").Length -gt 100000) {
            Expand-Archive "ocd.zip" "temp_ocd" -Force
            $dir = Get-ChildItem "temp_ocd" -Directory | Select-Object -First 1
            if ($dir) { Copy-Item "$($dir.FullName)/*" -Destination "release_pkg/tools/openocd/" -Recurse -Force }
          }

          Write-Output "=== CONTENIDO DEL ZIP ==="
          Get-ChildItem "release_pkg" -Recurse -File | ForEach-Object { "$($_.Name) - $($_.Length) bytes" }
          Compress-Archive "release_pkg/*" "PicoSIO-Flasher-Win64.zip" -Force
 

      - uses: actions/upload-artifact@v4
        with:
          name: PicoSIO-Flasher-Completo-Win64
          path: PicoSIO-Flasher-Win64.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PicoSIO-Flasher-Win64.zip
