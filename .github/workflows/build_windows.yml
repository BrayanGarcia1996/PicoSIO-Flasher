name: Compilar Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar y Compilar EXE
        run: |
          pip install -r requirements.txt
          pyinstaller --noconfirm --onefile --windowed --name "PicoSIO-Flasher" main.py

      - name: Descargar Herramientas con Python
        run: |
          python -c "
          import os, urllib.request, json, zipfile, shutil

          os.makedirs('release_pkg/firmwares', exist_ok=True)
          os.makedirs('release_pkg/tools/ite_scripts', exist_ok=True)
          os.makedirs('release_pkg/tools/flashrom', exist_ok=True)
          os.makedirs('release_pkg/tools/openocd', exist_ok=True)

          for f in ['dist/PicoSIO-Flasher.exe', 'chips_db.json', 'README.md']:
              if os.path.exists(f): shutil.copy(f, 'release_pkg/')
          open('release_pkg/tools/flashrom/LEEME.txt', 'w').write('Coloca aqui flashrom.exe y sus DLLs\n')

          def dl(url, dest):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=60) as r, open(dest, 'wb') as out:
                      shutil.copyfileobj(r, out)
                  print('[OK]', dest)
                  return True
              except Exception as e:
                  print('[ERROR]', dest, e)
                  return False

          # 1. Debugprobe y pico_serprog
          dl('https://github.com', 'release_pkg/firmwares/debugprobe.uf2')
          dl('https://github.com', 'release_pkg/firmwares/pico_serprog.uf2')

          # 2. Scripts y firmware ITE (rama master)
          if dl('https://github.com', 'ite.zip'):
              with zipfile.ZipFile('ite.zip') as z: z.extractall('temp_ite')
              for root, _, files in os.walk('temp_ite'):
                  for file in files:
                      if file.endswith('.py'):
                          shutil.copy(os.path.join(root, file), 'release_pkg/tools/ite_scripts/')
                      elif file.endswith('.uf2'):
                          shutil.copy(os.path.join(root, file), 'release_pkg/firmwares/ite_ec.uf2')

          # 3. Ultima version de OpenOCD Windows desde xPack
          try:
              req = urllib.request.Request('https://github.com', headers={'User-Agent': 'Mozilla/5.0'})
              data = json.loads(urllib.request.urlopen(req).read().decode())
              asset = next((a['browser_download_url'] for a in data.get('assets', []) if 'win32-x64.zip' in a['name']), None)
              if asset and dl(asset, 'ocd.zip'):
                  with zipfile.ZipFile('ocd.zip') as z: z.extractall('temp_ocd')
                  top = os.path.join('temp_ocd', os.listdir('temp_ocd'))
                  shutil.copytree(top, 'release_pkg/tools/openocd', dirs_exist_ok=True)
          except Exception as e:
              print('[ERROR] OpenOCD:', e)

          print('=== RESUMEN FINAL ===')
          for root, _, files in os.walk('release_pkg'):
              for file in files:
                  print(os.path.join(root, file))
          "

      - name: Comprimir Paquete Final
        shell: pwsh
        run: Compress-Archive "release_pkg/*" "PicoSIO-Flasher-Win64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PicoSIO-Flasher-Completo-Win64
          path: PicoSIO-Flasher-Win64.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PicoSIO-Flasher-Win64.zip
