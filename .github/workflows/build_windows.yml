name: Compilar Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar, Compilar y Empaquetar
        run: |
          pip install -r requirements.txt
          pyinstaller --noconfirm --onefile --windowed --name "PicoSIO-Flasher" main.py
          python build_package.py

      - uses: actions/upload-artifact@v4
        with:
          name: PicoSIO-Flasher-Completo-Win64
          path: PicoSIO-Flasher-Win64.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PicoSIO-Flasher-Win64.zip
